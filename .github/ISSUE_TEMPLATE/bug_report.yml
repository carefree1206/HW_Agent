name: 缺陷记录
description: 记录可以复现的业务、交互或平台故障
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤与初始条件
      description: 写明版本、演练条件和操作顺序，不上传真实数据库或凭据。
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果与期望结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 脱敏记录与验证范围
      description: 可附错误码、调用编号、截图或测试结果；注明本地规则或真实平台模式。
